<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Latihan Tailwind CSS</title>
   <link rel="stylesheet" href="./output.css">
</head>
<body class="grid justify-center">
   <section id="title" class="">
      <h1 class="font-bold m-5 text-center text-2xl">Todo List Application</h1>
   </section>
   <section id="input" class="">
      <input type="text" name="assignment" id="assignment" 
             class="border w-80 h-8 round"
             placeholder="Inputkan tugas yang akan dikerjakan ...">
      <input type="button" id="btn-tambah" value="TAMBAH"
             class="bg-slate-400 py-1 px-3 rounded hover:bg-slate-300 delay-100 font-bold">
   </section>
   <section id="output" class=""></section>
   <script src="main.js"></script>
</body>
</html>
